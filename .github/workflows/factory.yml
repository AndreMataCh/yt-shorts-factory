name: YT Shorts & Long Video Factory

on:
  repository_dispatch:
    types: [create_short]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ⚡ Notificar Arranque de Máquina a Telegram (Sin IndentationError)
        continue-on-error: true
        env:
          BUNDLE_JSON: ${{ github.event.client_payload.bundle_json || '' }}
        run: |
          python3 -c 'import os, json, urllib.request; b = json.loads(os.getenv("BUNDLE_JSON") or "{}"); tok, cid, mid, ch, top = b.get("telegram_bot_token",""), b.get("chat_id",""), b.get("status_msg_id",""), b.get("channel_name","Canal"), b.get("topic",""); req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/editMessageText", data=json.dumps({"chat_id": int(cid), "message_id": int(mid), "text": f"🎬 <b>Fábrica en Ejecución — {ch}</b>\n🟩🟩🟩🟩🟩⬜⬜⬜⬜⬜ <b>50%</b>\n\n📌 <b>Tema:</b> {top}\n⚡ <b>Estado actual:</b> Máquina Ubuntu activa en GitHub Actions ⚙️\n<i>Instalando FFmpeg, Kokoro-82M y Crawl4AI...</i>", "parse_mode": "HTML"}).encode(), headers={"Content-Type": "application/json"}) if (tok and cid and mid) else None; urllib.request.urlopen(req, timeout=10) if req else None'

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg y Fuentes del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Instalar dependencias de la Fábrica
        run: |
          python -m pip install --upgrade pip
          pip install httpx numpy soundfile google-api-python-client google-auth-oauthlib kokoro sounddevice crawl4ai playwright requests gradio_client
          playwright install chromium

      - name: 🔍 Inteligencia Web SEO (Crawl4AI)
        continue-on-error: true
        env:
          BUNDLE_JSON: ${{ github.event.client_payload.bundle_json || '' }}
          TOPIC: ${{ github.event.client_payload.topic || 'Tecnología y Misterios' }}
          CHANNEL_NAME: ${{ github.event.client_payload.channel_name || 'Canal Principal' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -f "seo_curator.py" ]; then
            python seo_curator.py
          fi

      - name: 🎬 Renderizar Video Pro y Publicar en YouTube
        env:
          BUNDLE_JSON: ${{ github.event.client_payload.bundle_json || '' }}
          CHANNEL_ID: ${{ github.event.client_payload.channel_id || 'ch1' }}
          CHANNEL_NAME: ${{ github.event.client_payload.channel_name || 'Canal Principal' }}
          CHANNEL_TOKEN_JSON: ${{ github.event.client_payload.channel_token_json || '' }}
          TOPIC: ${{ github.event.client_payload.topic || 'Tecnología y Misterios' }}
          VISUAL_STYLE: ${{ github.event.client_payload.visual_style || '2' }}
          VOICE_STYLE: ${{ github.event.client_payload.voice_style || '3' }}
          VIDEO_COUNT: ${{ github.event.client_payload.video_count || '1' }}
          MODE: ${{ github.event.client_payload.mode || '3' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.ALLOWED_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python run_job.py
