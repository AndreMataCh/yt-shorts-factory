name: YouTube Factory Pipeline

on:
  repository_dispatch:
    types: [create_short]
  workflow_dispatch:

jobs:
  build-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código de la fábrica
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (FFmpeg, etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev

      - name: Instalar dependencias de la Fábrica + Kokoro / Whisper / Crawl4AI / Gradio
        run: |
          python -m pip install --upgrade pip
          pip install httpx numpy soundfile google-api-python-client google-auth-oauthlib kokoro sounddevice crawl4ai playwright requests gradio_client
          playwright install chromium

      # --- PASO OPCIONAL DE CURACIÓN SEO ---
      - name: 🕵️‍♂️ Scrapear competencia con Crawl4AI (Opcional)
        continue-on-error: true
        env:
          CHANNEL_NAME: ${{ github.event.client_payload.channel_name }}
          TOPIC: ${{ github.event.client_payload.topic }}
        run: |
          if [ -f "seo_curator.py" ]; then
            python seo_curator.py
          else
            echo "seo_curator.py no encontrado, omitiendo paso opcional de scraping."
          fi
            # --- PASO PRINCIPAL DE LA FÁBRICA ---
      - name: 🎬 Generar Guiones, Audio Kokoro, Subtítulos Pop y Subir a YouTube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CHANNEL_ID: ${{ github.event.client_payload.channel_id }}
          CHANNEL_NAME: ${{ github.event.client_payload.channel_name }}
          CHANNEL_TOKEN_JSON: ${{ github.event.client_payload.channel_token_json }}
          TOPIC: ${{ github.event.client_payload.topic }}
          VISUAL_STYLE: ${{ github.event.client_payload.visual_style }}
          VOICE_STYLE: ${{ github.event.client_payload.voice_style }}
          VIDEO_COUNT: ${{ github.event.client_payload.video_count }}
          MODE: ${{ github.event.client_payload.mode }}
          MONETIZATION_URL: ${{ github.event.client_payload.monetization_url }}
          CUSTOM_TITLE: ${{ github.event.client_payload.custom_title }}
          CUSTOM_DESCRIPTION: ${{ github.event.client_payload.custom_description }}
          SOURCE_VIDEO_URL: ${{ github.event.client_payload.source_video_url }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: |
          python3 run_job.py
