name: YouTube Shorts Factory

on:
  repository_dispatch:
    types: [create_short]
  workflow_dispatch: # Permite probarlo con un botón manual desde GitHub

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar FFmpeg, eSpeak y Kokoro
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation espeak-ng
          pip install httpx kokoro soundfile google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Cargar Tokens de YouTube desde Secrets
        env:
          YT_TOKEN_1: ${{ secrets.YT_TOKEN_1 }}
          YT_TOKEN_2: ${{ secrets.YT_TOKEN_2 }}
        run: |
          mkdir -p tokens output
          echo "$YT_TOKEN_1" > tokens/token_1.json
          if [ -n "$YT_TOKEN_2" ]; then echo "$YT_TOKEN_2" > tokens/token_2.json; fi

      - name: Ejecutar Fábrica
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOPIC: ${{ github.event.client_payload.topic || 'Las 3 paradojas más extrañas del tiempo' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: python run_job.py
